version: "3.9"

# ============================================================
# AI 模拟面试平台 — 本地开发基础设施
# ============================================================
# MySQL 使用宿主机已有实例（localhost:3306，数据库 prepdeck，
# 由 prepdeck-backend/sql/init/init-database.sql 创建），不在此 compose 中。
# 本 compose 仅提供 Redis。
# 启动: docker compose up -d
# 停止: docker compose down
# ============================================================

services:
  # Redis — 缓存/会话
  redis:
    image: redis:7-alpine
    container_name: prepdeck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
