version: "3.9"

# ============================================================
# AI 模拟面试平台 — 本地开发基础设施
# ============================================================
# 启动: docker compose up -d
# 停止: docker compose down
# ============================================================

services:
  # PostgreSQL — 业务数据库
  postgres:
    image: postgres:16-alpine
    container_name: prepdeck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prepdeck
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — 缓存/会话
  redis:
    image: redis:7-alpine
    container_name: prepdeck-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Nacos — 注册中心 + 配置中心
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: prepdeck-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"

volumes:
  postgres-data:
  redis-data:
