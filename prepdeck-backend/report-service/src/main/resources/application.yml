server:
  port: 8084

spring:
  application:
    name: report-service
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:192.168.100.128:8848}
      config:
        file-extension: yml
        group: PREPDECK_GROUP
      discovery:
        group: PREPDECK_GROUP
  config:
    import: optional:nacos:${spring.application.name}-${spring.profiles.active:dev}.yml?group=PREPDECK_GROUP
  datasource:
    url: jdbc:postgresql://${DB_HOST:192.168.100.128}:5432/${DB_NAME:prepdeck}?charSet=UTF8&currentSchema=interview
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 1200000
      pool-name: MianbaPool

mybatis-plus:
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.prepdeck: ${LOG_LEVEL:DEBUG}
