server:
  port: 8089

spring:
  application:
    name: job-service
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:192.168.100.128:8848}
      config:
        file-extension: yml
        group: PREPDECK_GROUP
      discovery:
        group: PREPDECK_GROUP
        cluster-name: DEFAULT
    sentinel:
      eager: true
      log:
        dir: logs/csp
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active:dev}.yml?group=PREPDECK_GROUP
      - optional:nacos:prepdeck-ai-shared-dev.yml?group=PREPDECK_GROUP
  datasource:
    url: jdbc:postgresql://${DB_HOST:192.168.100.128}:5432/${DB_NAME:prepdeck}?charSet=UTF8&currentSchema=interview
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 1200000
      pool-name: JobPool

feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 15000
        loggerLevel: basic

mybatis-plus:
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.prepdeck: ${LOG_LEVEL:DEBUG}
