server:
  port: 8086

spring:
  application:
    name: quota-service
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:192.168.100.128:8848}
      config:
        file-extension: yml
        group: PREPDECK_GROUP
      discovery:
        group: PREPDECK_GROUP
        cluster-name: DEFAULT
  config:
    import: optional:nacos:${spring.application.name}-${spring.profiles.active:dev}.yml?group=PREPDECK_GROUP
  datasource:
    url: jdbc:postgresql://${DB_HOST:192.168.100.128}:5432/${DB_NAME:prepdeck}?charSet=UTF8&currentSchema=interview
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 1200000
      pool-name: QuotaPool
  data:
    redis:
      host: ${REDIS_HOST:192.168.100.128}
      port: ${REDIS_PORT:6379}

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 15000
        loggerLevel: basic

mybatis-plus:
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.prepdeck: ${LOG_LEVEL:DEBUG}
